name: CI
on:
  pull_request:
jobs:
  ciJvms:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The build tool is now sbt 2.x, which requires Java 17+, so the whole build (both the sbt
        # 1.x and sbt 2.x plugin artifacts) runs on Java 17+.
        java: [ '17', '21', '25' ]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 100
      - name: Fetch tags
        run: git fetch --depth=100 origin +refs/tags/*:refs/tags/*
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'sbt'
      - name: sbt +test +publishLocal ${{ github.ref }}
        run: ./sbt +test +publishLocal

  ci:
    if: always()
    runs-on: ubuntu-24.04
    needs: [ ciJvms ]
    steps:
      - uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
