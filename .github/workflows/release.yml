name: Release
on:
  push:
    branches: [ master ]
  release:
    types: [ published ]
jobs:
  release:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      # Release one axis at a time to avoid concurrent Sonatype staging.
      max-parallel: 1
      matrix:
        include:
          # sbt 1.x plugin: build on its minimum supported JDK (Java 8).
          - java: '8'
            scala: '2.12.20'
          # sbt 2.x plugin: the Scala 3 compiler bridge needs Java 17+.
          - java: '17'
            scala: '3.8.4'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'sbt'
      - name: sbt ci-release (Scala ${{ matrix.scala }}) ${{ github.ref }}
        # Restrict the cross build to a single axis so this job publishes only that artifact on the
        # matching JDK; `ci-release` still handles the snapshot-vs-tag logic and Sonatype release.
        run: ./sbt 'set crossScalaVersions := Seq("${{ matrix.scala }}")' ci-release
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
